[package]
name = "elixa_core"
version = "0.1.0"
edition = "2021"
description = "ELIXA Distributed Compute Core — Signal Engine en Rust"
authors = ["ELIXA Systems"]
license = "MIT"

[[bin]]
name = "elixa_core"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
